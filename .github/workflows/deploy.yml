name: Deploy to Cloudflare

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Clean Linux runner installs the native binaries (workerd/esbuild) fine —
      # the issue that blocked the Windows sandbox does not apply here.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Quality gate
        run: npm run check:quality

      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          if [ -n "$DATABASE_URL" ]; then
            sudo apt-get update -y && sudo apt-get install -y postgresql-client
            for file in supabase/migrations/*.sql; do
              echo "Applying $file"
              psql "$DATABASE_URL" -f "$file"
            done
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      # Optional: if these are added as GitHub Actions secrets, they are pushed to
      # the Worker automatically. Otherwise set them once via `wrangler secret put`
      # (they persist across deploys). The values are never printed.
      - name: Sync Worker runtime secrets (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -e
          if [ -n "$DATABASE_URL" ]; then printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL; fi
          if [ -n "$OPENAI_API_KEY" ]; then printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY; fi
          if [ -n "$ADMIN_PASSWORD" ]; then printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD; fi
